en:
  npn_submissions:
    title: "NPN Submissions"
    errors:
      not_allowed: "You do not have permission to submit critiques."
      daily_limit_reached: "Only one critique submission is allowed per day."
      invalid_type: "That submission type isn't recognised."
      managed_category_locked: "Topics in this category can only be created via the NPN submission flow."
      preview_failed: "Sorry — something went wrong building the preview. Please try again."
      unexpected: "Sorry — something went wrong. Please try again."
      edit_not_allowed: "You can't edit this post any more."
      images_locked: "Images can't be changed after someone else has replied, since their critiques refer to them. Text and tags can still be edited."
  site_settings:
    npn_submissions_enabled: "Enable the NPN submissions plugin."
    npn_submissions_allowed_groups: "Groups whose members may use the submission flows. Admins can always submit."
    npn_submissions_managed_category_ids: "Categories managed by this plugin. Regular users and moderators cannot create topics in these categories through the normal composer."
    npn_submissions_critique_category_id: "Target category for image critique submissions."
    npn_submissions_project_category_id: "Target category for project critique submissions."
    npn_submissions_project_fallback_tag: "Project topics with this tag but no submission record (older or hand-written posts) still get the project tools (sequence builder, project wall, View the project), with images read from the first post. Leave blank to turn this off."
    npn_submissions_introduction_category_id: "Target category for member introduction submissions."
    npn_submissions_new_member_image_category_id: "Target category for New Members Area image submissions."
    npn_submissions_help_category_id: "Target category for Help submissions (/submit?type=help). Add to npn_submissions_managed_category_ids to lock down composer-based posting in that category."
    npn_submissions_weekly_challenge_tag: "Tag applied to weekly challenge submissions."
    npn_submissions_descriptive_tag_group: "Restrict the descriptive tags submitters can choose to the tags in this tag group (or groups). Leave empty to allow any existing tag."
    npn_submissions_project_tag: "Tag applied to project critique submissions."
    npn_submissions_convert_uploads_to_srgb: "Convert uploaded images with a non-sRGB colour profile (ProPhoto RGB, Adobe RGB, Display P3, monitor profiles) to sRGB on upload, so the original shown in the lightbox and critique workspace matches the resized copies in posts. Applies to every image upload site-wide."
    npn_submissions_enforce_daily_limit: "Limit non-admin users to one submission per local calendar day."
    npn_submissions_max_single_images: "Maximum images per single-image submission."
    npn_submissions_max_project_images: "Maximum images per project submission."
    npn_submissions_min_project_images: "Minimum images per project submission."
    npn_submissions_max_image_size_mb: "Maximum size (MB) of an uploaded image."
    npn_submissions_downsample_threshold_mb: "Size (MB) shown in the upload guidance above which images may be downsampled by the forum. Guidance only; not enforced here."
    npn_submissions_new_image_form_enabled: "Offer the new photo-first image submission form for Image for Critique and the Weekly Challenge. Members can switch between it and the classic form at any time. Turn off to withdraw the new form and its links."
    npn_submissions_new_image_form_default: "Open the new photo-first form by default. Members can still go back to the classic form, and whichever form they last switched to is remembered in their browser. Turn off to make the classic form the default again."
    npn_submissions_new_image_form_feedback_category_id: 'Category for the new form''s "Tell us what you think" link. The link opens a new topic titled "Feedback on the new submission form" in this category. Leave blank to let members pick the category.'
    npn_submissions_export_guide_url: "URL of the export guide shown in the submission UI."
    npn_submissions_critique_guide_url: "URL of the critique guidelines shown in the submission UI."
    npn_submissions_project_guidelines_url: "URL of the project guidelines shown in the submission UI."
    npn_submissions_weekly_challenge_url: "URL of the weekly challenge information page. Used as the panel link and as the fallback when WordPress sync is unavailable."
    npn_submissions_weekly_challenge_api_url: "WordPress REST URL returning the current Weekly Challenge ACF fields (wc_title, wc_dates, wc_description). Fetched server-side and cached. Leave empty to disable sync and use the static panel."
    npn_submissions_weekly_challenge_cache_minutes: "How long (minutes) to cache the Weekly Challenge data fetched from WordPress."
